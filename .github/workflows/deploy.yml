name: Deploy (Production)

on:
  push:
    branches: ["master"]

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            cd /www/wwwroot/meteorikahimob.com.br
            git fetch --all
            git reset --hard origin/master
            composer install --no-dev --optimize-autoloader
            php83 -m | grep -i "^imagick$" >/dev/null || { echo "Imagick extension is not loaded in php83. Install/enable Imagick before processing property images."; exit 1; }
            php83 artisan migrate --force
            php83 artisan optimize:clear
            php83 artisan config:cache
            php83 artisan route:cache
            php83 artisan view:cache
            php83 artisan queue:restart
